<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- NoteMark app icon. Source of truth for build/icon.png and resources/icon.png
       (regenerate with `node scripts/render-assets.mjs`). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30323A"/>
      <stop offset="1" stop-color="#16171B"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7C96B"/>
      <stop offset="1" stop-color="#E39A1F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="56" y="56" width="912" height="912" rx="208" fill="url(#bg)"/>
  <rect x="56.5" y="56.5" width="911" height="911" rx="207.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Sheet of paper with a folded top-right corner -->
  <g filter="url(#shadow)">
    <path d="M318 236 H600 L716 352 V770 a28 28 0 0 1 -28 28 H318 a28 28 0 0 1 -28 -28 V264 a28 28 0 0 1 28 -28 Z" fill="#F6F2E9"/>
    <path d="M600 236 V324 a28 28 0 0 0 28 28 H716 Z" fill="url(#fold)"/>
  </g>

  <!-- Heading marker and text lines -->
  <g stroke-linecap="round">
    <line x1="372" y1="420" x2="420" y2="420" stroke="#E39A1F" stroke-width="34"/>
    <line x1="470" y1="420" x2="626" y2="420" stroke="#2B2D33" stroke-width="34"/>
    <line x1="372" y1="520" x2="640" y2="520" stroke="#BDB6A8" stroke-width="26"/>
    <line x1="372" y1="596" x2="604" y2="596" stroke="#BDB6A8" stroke-width="26"/>
    <line x1="372" y1="672" x2="520" y2="672" stroke="#BDB6A8" stroke-width="26"/>
  </g>
</svg>
