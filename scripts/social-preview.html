<!doctype html>
<!-- GitHub social preview (1280×640). Rendered to docs/social-preview.png by render-assets.mjs. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        color: #ececef;
        background:
          radial-gradient(900px 500px at 85% 110%, rgba(242, 184, 75, 0.22), transparent 60%),
          linear-gradient(160deg, #24252b 0%, #141518 100%);
        position: relative;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 92px;
        width: 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand img {
        width: 88px;
        height: 88px;
      }
      .brand h1 {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -1.5px;
      }
      .tagline {
        margin-top: 30px;
        font-size: 34px;
        line-height: 1.25;
        font-weight: 600;
      }
      .tagline em {
        font-style: normal;
        color: #f2b84b;
      }
      .sub {
        margin-top: 18px;
        font-size: 21px;
        line-height: 1.45;
        color: #a3a3ad;
      }
      .chips {
        margin-top: 34px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .chips span {
        font-size: 17px;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #d8d8de;
      }
      .shot {
        position: absolute;
        left: 640px;
        top: 70px;
        width: 820px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <img src="../build/icon.svg" alt="" />
        <h1>NoteMark</h1>
      </div>
      <p class="tagline">Local-first <em>Markdown</em> notes for your desktop</p>
      <p class="sub">Plain .md files, a rich editor and instant search. Free and open source.</p>
      <div class="chips">
        <span>Windows · macOS · Linux</span>
        <span>Command palette</span>
        <span>PDF export</span>
      </div>
    </div>
    <img class="shot" src="../docs/screenshots/notemark-dark.png" alt="" />
  </body>
</html>
