appId: com.abduldevhub.notemark
productName: NoteMark
copyright: Copyright © 2024-2026 Abdul Khan
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.github/*'
  - '!src/*'
  - '!e2e/*'
  - '!docs/*'
  - '!context/*'
  - '!test-results/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vitest,playwright}.config.ts'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,AGENTS.md,CONTRIBUTING.md,SECURITY.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: NoteMark
  target:
    - nsis
nsis:
  artifactName: NoteMark-${version}-Setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
  notarize: false
dmg:
  artifactName: NoteMark-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Abdul Khan <ahkn63@gmail.com>
  category: Office
  synopsis: Local-first Markdown notes
  description: A fast, local-first Markdown notes app. Notes are plain .md files.
appImage:
  artifactName: NoteMark-${version}-${arch}.${ext}
deb:
  artifactName: NoteMark-${version}-${arch}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: AbdulDevHub
  repo: NoteMark
  releaseType: draft
